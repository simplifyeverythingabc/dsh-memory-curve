# dsh-memory-curve bundle patch
#
# 往宿主组合里插一行 dsh-memory-curve：把「按遗忘曲线分级后的事件索引」
# 注册成提示变量 memory_curve（读），并注册六个工具（搜索 / 读摘要 / 取原文 / 列日期 / 看分级 / 重建）。
#
# 完整记忆不在这里 —— 它留在配置好的内存目录里（默认 <DSH_HOME>/memory）。
# 这一行只负责把上千条对话压成几百字的标题，喂进系统提示。
- insert:
    - id: memory-curve
      name: dsh-memory-curve
      config:
        # 各级最多列几条，控制注入体积。调大更全但更占上下文。
        maxL1: 12
        maxL2: 20
        maxL3: 8
        # 安装 0.3.0 Bundle 会启用后台采集；设 false 可关闭，已有流水保留。
        autoCollect: true
        collectSubagents: false
        # collectExcludeCwds: 'C:\private;D:\private' # 路径及其子目录排除
        # collectExcludeSessions: 'session-id'        # 会话 ID 排除
        # collectFlushMs: 1500
        # collectScanMs: 60000
        # collectSummaryMs: 5000
        # memoryDir: D:\memory   # 自动采集和插件同目录；独立 CLI 仍使用 DSH_MEMORY_DIR
        # disabled: true         # 临时停用：不注册工具也不注入
