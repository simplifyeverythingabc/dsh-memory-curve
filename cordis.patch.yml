# dsh-memory-curve bundle patch
#
# 往宿主组合里插一行 dsh-memory-curve：把「按遗忘曲线分级后的事件索引」
# 注入系统提示（主通道是 systemPrompt.context，名字 memory-curve-index；宿主只给
# prompt.variable 时才退回提示变量 memory_curve），并注册六个工具
# （搜索 / 读摘要 / 取原文 / 列日期 / 看分级 / 重建）。
#
# 完整记忆不在这里 —— 它留在配置好的内存目录里（默认 <DSH_HOME>/memory）。
# 这一行只负责把上千条对话压成几百字的标题，喂进系统提示。
- insert:
    - id: memory-curve
      name: dsh-memory-curve
      config:
        # ⚠️ 这里**刻意不写** maxL1 / maxL2 / maxL3。
        #
        # 0.15.0 把代码默认值从 12/20/8 收到 6/8/3，但这份 patch 里还写死着旧值，
        # 而 bundle patch 的优先级**高于**代码默认值 —— 结果改了代码等于没改：
        # 实测真机注入一直是 834 token，而同一份代码用默认值跑出来是 690。
        #
        # 同一个数写在两处，必然漂。要调配额就改 src/index.js 的 Config 默认值；
        # 真要在这里覆盖也行，但别再照抄默认值当文档。
        #
        # autoCollect 不能删：它控制后台采集，默认 false（见 collector-host-test）。
        autoCollect: true
        collectSubagents: false
        # collectExcludeCwds: 'C:\private;D:\private' # 路径及其子目录排除
        # collectExcludeSessions: 'session-id'        # 会话 ID 排除
        # collectFlushMs: 1500
        # collectScanMs: 60000
        # collectSummaryMs: 5000
        # memoryDir: D:\memory   # 自动采集和插件同目录；独立 CLI 仍使用 DSH_MEMORY_DIR
        # disabled: true         # 临时停用：不注册工具也不注入
