name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    name: 语法检查
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 源码语法（扫目录，与本地同一条路径）
        run: node tools/check.mjs

      - name: 检查 package.json 合法性
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version||!p.exports) process.exit(1); console.log(p.name, p.version)"

  smoke:
    name: 冒烟测试
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 建一份最小流水
        run: |
          mkdir -p /tmp/memory
          cat > /tmp/memory/2026-01-15.md <<'EOF'
          2026-01-15 10:00 ［用户］ <!-- m_20260115_a1b2c3 -->
          连接池超时怎么排查

          2026-01-15 10:01 ［助手］ <!-- m_20260115_d4e5f6 -->
          先看 maxWait 和数据库的 wait_timeout，两边对不上就会超时。
          EOF

      - name: 用最小流水跑一遍分级
        env:
          DSH_MEMORY_DIR: /tmp/memory
          DSH_HOME: /tmp/dsh-home
        run: |
          node --input-type=module -e "
            import { readEntries, clusterEvents, gradeEvents } from './src/events.js';
            const entries = readEntries('/tmp/memory');
            if (entries.length !== 2) { console.error('条目数不对:', entries.length); process.exit(1); }
            const events = clusterEvents(entries);
            if (events.length === 0) { console.error('没聚出事件'); process.exit(1); }
            const graded = gradeEvents(events, Date.now(), () => ({ n: 0, last: null }));
            console.log('条目', entries.length, '事件', events.length, '分级', graded.length);
            const bad = graded.filter(g => !g.level);
            if (bad.length) { console.error('有事件没分级'); process.exit(1); }
            console.log('OK');
          "

      - name: 检索质量基准
        env:
          MC_BENCH_ROOT: /tmp
        run: node tools/bench.mjs

  selftest:
    name: 接口自检
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # src/index.js 用的是静态 import '@deepseek-ai/schemastery'，
      # 这个包只有 DSH 宿主里有。CI 里造一个最小 stub —— 只够让
      # z.object/z.string/z.number/z.boolean 与 default/description/volatile/min/max 链式调用成立，不是真实现。
      # 有了它，selftest 才能在干净环境里跑，把「接口形状对不对」纳入 CI。
      - name: 造 schemastery stub
        run: |
          mkdir -p node_modules/@deepseek-ai/schemastery
          cat > node_modules/@deepseek-ai/schemastery/package.json <<'EOF'
          {
            "name": "@deepseek-ai/schemastery",
            "version": "0.0.0",
            "type": "module",
            "main": "index.js"
          }
          EOF
          cat > node_modules/@deepseek-ai/schemastery/index.js <<'EOF'
          const mk = (type, meta = {}) => {
            const fn = (v) => (v === undefined ? meta.default : v);
            fn.type = type;
            fn.meta = meta;
            fn.dict = undefined;
            fn.default = (d) => mk(type, { ...meta, default: d });
            fn.description = (s) => mk(type, { ...meta, description: s });
            fn.volatile = () => mk(type, { ...meta, volatile: true });
            // 数值约束：真 schemastery 支持链式调用；stub 接受并记录元数据。
            fn.min = (n) => mk(type, { ...meta, min: n });
            fn.max = (n) => mk(type, { ...meta, max: n });
            fn.toJSON = () => ({ type, meta });
            return fn;
          };
          const z = {
            string: () => mk('string'),
            number: () => mk('number'),
            boolean: () => mk('boolean'),
            object: (dict) => {
              const fn = (v) => v;
              fn.type = 'object';
              fn.meta = { default: {} };
              fn.dict = dict;
              fn.toJSON = () => ({ type: 'object', meta: fn.meta, dict });
              return fn;
            },
          };
          export default z;
          EOF

      - name: 自动采集与故障恢复测试
        run: node --test tools/collector-test.mjs tools/collector-host-test.mjs

      - name: 接口自检（29 项；Linux 28）
        env:
          DSH_HOME: /tmp/dsh-home-ci
          MC_SELFTEST_ROOT: /tmp
        run: node tools/selftest.mjs

      - name: 校验器自证（会红 + 会绿）
        env:
          DSH_HOME: /tmp/dsh-home-ci
        run: |
          set -e
          mkdir -p /tmp/vmem /tmp/dsh-home-ci/memory-notes/_digest
          printf '2026-01-15 10:00 ［用户］ <!-- m_20260115_a1b2c3 -->\n连接池超时怎么排查\n' > /tmp/vmem/2026-01-15.md
          printf '# 2026-01-15 摘要\n\n## 10:00 ［用户］ 连接池超时（1条）\n\n覆盖: m_20260115_a1b2c3\n' \
            > /tmp/dsh-home-ci/memory-notes/_digest/2026-01-15.md

          # 1) 正常数据必须绿
          if ! DSH_MEMORY_DIR=/tmp/vmem node tools/verify-ids.mjs; then
            echo "正常数据被判异常 —— 校验器在乱报"
            exit 1
          fi

          # 2) 手动引一个不存在的 id，必须红
          sed -i 's/m_20260115_a1b2c3/m_20260115_fffff0/' /tmp/dsh-home-ci/memory-notes/_digest/2026-01-15.md
          set +e
          DSH_MEMORY_DIR=/tmp/vmem node tools/verify-ids.mjs
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "坏数据没被判异常（退出码 $code）—— 假绿灯又回来了"
            exit 1
          fi
          echo "verify-ids 正确报红（退出码 1）"
